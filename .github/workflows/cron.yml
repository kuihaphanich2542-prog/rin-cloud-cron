name: Rin Pure Cloud Cron Pinger

on:
  schedule:
    - cron: "*/5 1-11 * * 1-5"
    - cron: "29 1 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Unified Reminder Endpoint
        run: |
          curl -fsSL -m 25 -H "User-Agent: GitHub-Public-Cloud-Cron/1.0" "https://rin-meeting-notifier.vercel.app/api/reminder"
          echo ""

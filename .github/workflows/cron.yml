name: Rin Pure Cloud Cron Pinger

on:
  schedule:
    - cron: "*/5 1-11 * * 1-5"
    - cron: "29 1 * * 1-5"
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

jobs:
  shift_1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Active Cloud Ticker (5.5h Shift - Mon-Fri 08:00-18:05 BKK)
        run: |
          echo "☁️ Starting GitHub Cloud Active Ticker Shift..."
          for i in $(seq 1 110); do
            DOW=$(TZ="Asia/Bangkok" date +%u)
            HM=$(TZ="Asia/Bangkok" date +%H%M)
            TS=$(TZ="Asia/Bangkok" date "+%Y-%m-%d %H:%M:%S")
            if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ] && [ "$HM" -ge 0800 ] && [ "$HM" -le 1805 ]; then
              echo "[$TS BKK] ⏰ Pinging Vercel /api/reminder..."
              curl -fsSL -m 25 -H "User-Agent: GitHub-Public-Cloud-Cron/2.0" "https://rin-meeting-notifier.vercel.app/api/reminder" || true
              echo ""
            else
              echo "[$TS BKK] 🌙 Outside active window (DOW=$DOW HM=$HM). Standing by on Cloud..."
            fi
            sleep 180
          done
  shift_2:
    runs-on: ubuntu-latest
